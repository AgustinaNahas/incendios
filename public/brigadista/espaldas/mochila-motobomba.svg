<text id="Mochila de la motobomba" fill="white" style="white-space: pre" xml:space="preserve" font-family="Noto Serif Tamil" font-size="22" font-weight="bold" letter-spacing="0em"><tspan x="888.895" y="424.726">Mochila de la motobomba</tspan></text>
<text id="Utilizada por el brigadista bobero, transporta exclusivamente la motobomba de alta presi&#195;&#179;n. Su funci&#195;&#179;n es proveer el bombeo de agua principal durante la extinci&#195;&#179;n, siendo una tarea de gran exigencia f&#195;&#173;sica que exime al brigadista de cargar otras herramientas." fill="white" style="white-space: pre" xml:space="preserve" font-family="Noto Serif Tamil" font-size="20" letter-spacing="0em"><tspan x="888.895" y="473.86">Utilizada por el brigadista bobero, transporta </tspan><tspan x="888.895" y="504.86">exclusivamente la motobomba de alta </tspan><tspan x="888.895" y="535.86">presi&#xf3;n. Su funci&#xf3;n es proveer el bombeo de </tspan><tspan x="888.895" y="566.86">agua principal durante la extinci&#xf3;n, siendo </tspan><tspan x="888.895" y="597.86">una tarea de gran exigencia f&#xed;sica que exime </tspan><tspan x="888.895" y="628.86">al brigadista de cargar otras herramientas.</tspan></text>
